<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Danh bạ cơ quan </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0a5e8f, #0f3b5c);
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.85;
    }

    /* container */
    .app-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* breadcrumb & back button */
    .nav-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      color: #1e293b;
    }

    .back-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateX(-2px);
    }

    .current-dept-badge {
      background: #e6f0ff;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      color: #0f62fe;
    }

    /* Department grid (cards) */
    .dept-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .dept-card {
      background: white;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid #e9eef3;
      text-align: center;
    }

    .dept-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
      border-color: #cbdff5;
      background: #ffffff;
    }

    .dept-icon {
      font-size: 44px;
      margin-bottom: 16px;
    }

    .dept-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f3b5c;
    }

    .dept-count {
      font-size: 13px;
      color: #5b6e8c;
      background: #f1f5f9;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 30px;
    }

    /* staff grid */
    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .staff-card {
      background: white;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.03);
      transition: 0.2s;
      border: 1px solid #eef2f8;
      cursor: pointer;
    }

    .staff-card:hover {
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.08);
      transform: translateY(-3px);
    }

    .staff-top {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .staff-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: #eef2ff;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .staff-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0c4e6e;
    }

    .staff-title {
      font-size: 13px;
      font-weight: 500;
      color: #2c6e9e;
      background: #ecf7ff;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 40px;
    }

    .staff-info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px dashed #ecf3f9;
    }

    .staff-tag-dept {
      margin-top: 12px;
      font-size: 12px;
      color: #5b6e8c;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 30px;
      display: inline-block;
    }

    .empty-state {
      background: #fef9e3;
      border-radius: 28px;
      padding: 48px 20px;
      text-align: center;
      color: #b45309;
      font-weight: 500;
    }

    .loading-state {
      text-align: center;
      padding: 60px;
      color: #2c6e9e;
      font-weight: 500;
    }

    /* modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: white;
      max-width: 520px;
      width: 100%;
      border-radius: 36px;
      padding: 28px 28px 32px;
      position: relative;
      animation: fadeSlide 0.2s ease;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-close {
      position: absolute;
      right: 20px;
      top: 18px;
      font-size: 30px;
      cursor: pointer;
      color: #8ba0bc;
      transition: 0.15s;
    }

    .modal-close:hover {
      color: #1e293b;
    }

    .modal-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 18px;
      display: block;
      border: 3px solid #eef2ff;
    }

    .modal-name {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .modal-job {
      text-align: center;
      color: #0f62fe;
      font-weight: 500;
      background: #ecf5ff;
      display: inline-block;
      padding: 4px 18px;
      border-radius: 40px;
      margin: 0 auto 20px;
      width: fit-content;
    }

    .detail-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .detail-item {
      background: #f9fcff;
      padding: 12px 16px;
      border-radius: 20px;
      border: 1px solid #eef2fa;
    }

    .detail-item b {
      display: block;
      font-size: 13px;
      color: #3b5e7e;
      margin-bottom: 6px;
    }

    hr {
      margin: 8px 0;
    }

    @media (max-width: 640px) {
      .staff-grid {
        grid-template-columns: 1fr;
      }
      .dept-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📋 DANH BẠ THUẾ TỈNH THÁI NGUYÊN</h1>
 
</div>

<div class="app-container">
  <!-- khu vực điều hướng, chỉ hiển thị khi đang ở chế độ xem nhân sự -->
  <div class="nav-section" id="navSection" style="display: none;">
    <button class="back-btn" id="backToDeptBtn">← Tất cả phòng ban</button>
    <div class="current-dept-badge" id="currentDeptLabel"></div>
  </div>

  <!-- Khu vực danh sách phòng ban -->
  <div id="deptView">
    <div class="loading-state" id="deptLoading">Đang tải danh sách phòng ban...</div>
    <div class="dept-grid" id="deptGrid"></div>
  </div>

  <!-- Khu vực danh sách nhân sự theo phòng (ẩn ban đầu) -->
  <div id="staffView" style="display: none;">
    <div class="loading-state" id="staffLoading" style="display: none;">Đang tải nhân sự...</div>
    <div class="staff-grid" id="staffGrid"></div>
  </div>
</div>

<!-- Modal chi tiết nhân sự -->
<div class="modal" id="staffModal">
  <div class="modal-card">
    <span class="modal-close" id="closeModalBtn">&times;</span>
    <img id="modalAvatar" class="modal-avatar" src="https://i.imgur.com/HeIi0wU.png" alt="avatar">
    <div class="modal-name" id="modalName">---</div>
    <div style="display: flex; justify-content: center;"><div class="modal-job" id="modalJob"></div></div>
    <div class="detail-grid">
      <div class="detail-item"><b>🏢 Đơn vị</b><span id="modalUnit"></span></div>
      <div class="detail-item"><b>📱 Điện thoại di động</b><span id="modalPhone"></span></div>
      <div class="detail-item"><b>☎️ Máy cơ quan</b><span id="modalOfficePhone"></span></div>
      <div class="detail-item"><b>🎂 Ngày sinh</b><span id="modalBirth"></span></div>
      <div class="detail-item"><b>🏦 BIDV</b><span id="modalBidv"></span></div>
      <div class="detail-item"><b>🌾 Agribank</b><span id="modalAgri"></span></div>
    </div>
  </div>
</div>

<script>
  // Google Sheet URL (opensheet)
  const SHEET_URL = 'https://opensheet.elk.sh/1wH_rQwpF2jRO_8s277hq_kmuN-i79JMzKqNx43XAK0Y/Sheet1';
  
  let masterData = [];        // lưu toàn bộ dòng dữ liệu gốc
  let departmentsSet = new Set(); // tập phòng ban
  let currentDept = null;     // phòng ban đang được chọn

  // DOM elements
  const deptViewDiv = document.getElementById('deptView');
  const staffViewDiv = document.getElementById('staffView');
  const navSection = document.getElementById('navSection');
  const currentDeptLabel = document.getElementById('currentDeptLabel');
  const backBtn = document.getElementById('backToDeptBtn');
  const deptGrid = document.getElementById('deptGrid');
  const staffGrid = document.getElementById('staffGrid');
  const deptLoadingSpan = document.getElementById('deptLoading');
  const staffLoadingSpan = document.getElementById('staffLoading');

  // Modal elements
  const modal = document.getElementById('staffModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const modalAvatar = document.getElementById('modalAvatar');
  const modalName = document.getElementById('modalName');
  const modalJob = document.getElementById('modalJob');
  const modalUnit = document.getElementById('modalUnit');
  const modalPhone = document.getElementById('modalPhone');
  const modalOfficePhone = document.getElementById('modalOfficePhone');
  const modalBirth = document.getElementById('modalBirth');
  const modalBidv = document.getElementById('modalBidv');
  const modalAgri = document.getElementById('modalAgri');

  // ----- helper: sắp xếp nhân sự theo chức danh (công việc) ưu tiên: trưởng phòng > phó > chuyên viên...
  function sortByJobTitle(employees) {
    // Hàm xác định thứ tự ưu tiên dựa trên từ khóa chức danh
    const getRank = (jobTitle = '') => {
      const title = jobTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (title.includes('truong phong') || title.includes('trưởng phòng') || title === 'trưởng phòng') return 1;
      if (title.includes('pho phong') || title.includes('phó phòng')) return 2;
      if (title.includes('chuyen vien chinh') || title.includes('chuyên viên chính')) return 3;
      if (title.includes('chuyen vien') || title.includes('chuyên viên')) return 4;
      if (title.includes('nhan vien') || title.includes('nhân viên')) return 5;
      return 6; // khác
    };
    return [...employees].sort((a, b) => {
      const rankA = getRank(a.congViec);
      const rankB = getRank(b.congViec);
      if (rankA !== rankB) return rankA - rankB;
      // nếu cùng cấp thì sắp xếp theo tên
      return (a.hoTen || '').localeCompare(b.hoTen || '', 'vi');
    });
  }

  // Hiển thị danh sách phòng ban (từ masterData)
  function renderDepartments() {
    deptLoadingSpan.style.display = 'none';
    if (!masterData.length) {
      deptGrid.innerHTML = '<div class="empty-state">⚠️ Không tìm thấy dữ liệu từ Google Sheet</div>';
      return;
    }
    // thu thập các phòng ban hợp lệ (bỏ qua null/empty)
    const deptMap = new Map(); // key: tên phòng, value: số lượng
    masterData.forEach(item => {
      const dept = item.donVi;
      if (dept && typeof dept === 'string' && dept.trim() !== '') {
        const key = dept.trim();
        deptMap.set(key, (deptMap.get(key) || 0) + 1);
      }
    });
    if (deptMap.size === 0) {
      deptGrid.innerHTML = '<div class="empty-state">📭 Chưa có dữ liệu phòng ban</div>';
      return;
    }
    const sortedDepts = Array.from(deptMap.keys()).sort((a,b) => a.localeCompare(b, 'vi'));
    deptGrid.innerHTML = '';
    for (let deptName of sortedDepts) {
      const count = deptMap.get(deptName);
      const card = document.createElement('div');
      card.className = 'dept-card';
      card.setAttribute('data-dept', deptName);
      card.innerHTML = `
        <div class="dept-icon">🏛️</div>
        <div class="dept-name">${escapeHtml(deptName)}</div>
        <div class="dept-count">${count} cán bộ</div>
      `;
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        openStaffByDepartment(deptName);
      });
      deptGrid.appendChild(card);
    }
  }

  // Mở danh sách nhân sự theo phòng ban + sắp xếp theo chức danh
  function openStaffByDepartment(departmentName) {
    if (!departmentName) return;
    currentDept = departmentName;
    // lọc nhân sự thuộc phòng ban đó
    let filtered = masterData.filter(item => {
      const itemDept = item.donVi ? item.donVi.trim() : '';
      return itemDept === departmentName;
    });
    // sắp xếp theo chức danh
    const sortedStaff = sortByJobTitle(filtered);
    
    // Cập nhật giao diện: ẩn deptView, hiện staffView + nav
    deptViewDiv.style.display = 'none';
    staffViewDiv.style.display = 'block';
    navSection.style.display = 'flex';
    currentDeptLabel.textContent = departmentName;
    
    renderStaffList(sortedStaff, departmentName);
  }

  // Render danh sách thẻ nhân viên theo thứ tự chức vụ
  function renderStaffList(staffList, deptName) {
    staffLoadingSpan.style.display = 'none';
    if (!staffList.length) {
      staffGrid.innerHTML = `<div class="empty-state">🏢 Phòng "${escapeHtml(deptName)}" hiện chưa có cán bộ nào.</div>`;
      return;
    }
    staffGrid.innerHTML = '';
    staffList.forEach(person => {
      const card = document.createElement('div');
      card.className = 'staff-card';
      const avatarUrl = person.avatar && person.avatar.trim() !== '' ? person.avatar : 'https://i.imgur.com/HeIi0wU.png';
      const fullName = person.hoTen || 'Chưa cập nhật';
      const jobTitle = person.congViec || 'Chức danh';
      const phone = person.soDienThoai || '---';
      const officePhone = person.phone_cq || '---';
      card.innerHTML = `
        <div class="staff-top">
          <img class="staff-avatar" src="${avatarUrl}" alt="avatar" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">
          <div>
            <div class="staff-name">${escapeHtml(fullName)}</div>
            <div class="staff-title">${escapeHtml(jobTitle)}</div>
          </div>
        </div>
        <div class="staff-info-row">
          <span>📞 Di động</span>
          <b>${escapeHtml(phone)}</b>
        </div>
        <div class="staff-info-row">
          <span>📞 Máy CQ</span>
          <b>${escapeHtml(officePhone)}</b>
        </div>
        <div class="staff-tag-dept">🏷️ ${escapeHtml(deptName)}</div>
      `;
      // mở modal khi click vào thẻ nhân viên
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        openStaffModal(person);
      });
      staffGrid.appendChild(card);
    });
  }

  // Mở modal chi tiết nhân viên
  function openStaffModal(person) {
    const avatarUrl = (person.avatar && person.avatar.trim()) ? person.avatar : 'https://i.imgur.com/HeIi0wU.png';
    modalAvatar.src = avatarUrl;
    modalName.textContent = person.hoTen || '---';
    modalJob.textContent = person.congViec || 'Chức vụ';
    modalUnit.textContent = person.donVi || '---';
    modalPhone.textContent = person.soDienThoai || '---';
    modalOfficePhone.textContent = person.phone_cq || '---';
    modalBirth.textContent = person.ngaySinh || '---';
    modalBidv.textContent = person.bidv || '---';
    modalAgri.textContent = person.agribank || '---';
    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  // Quay lại màn hình danh sách phòng ban
  function backToDepartments() {
    currentDept = null;
    deptViewDiv.style.display = 'block';
    staffViewDiv.style.display = 'none';
    navSection.style.display = 'none';
    // làm mới danh sách phòng ban (tránh sai lệch)
    renderDepartments();
  }

  // Helper: escape HTML cơ bản tránh XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // Tải dữ liệu từ Google Sheet
  async function loadMasterData() {
    try {
      deptLoadingSpan.style.display = 'block';
      deptLoadingSpan.textContent = 'Đang tải dữ liệu từ cơ sở dữ liệu...';
      const response = await fetch(SHEET_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rawData = await response.json();
      if (!Array.isArray(rawData) || rawData.length === 0) {
        masterData = [];
        deptLoadingSpan.textContent = 'Không có dữ liệu hoặc sheet trống';
        renderDepartments();
        return;
      }
      // Chuẩn hóa dữ liệu: các trường cần thiết
      masterData = rawData.map(row => ({
        hoTen: row.hoTen || row['Họ tên'] || '',
        donVi: row.donVi || row['Đơn vị'] || '',
        congViec: row.congViec || row['Chức danh'] || row['Công việc'] || '',
        soDienThoai: row.soDienThoai || row['Số điện thoại'] || row['Di động'] || '',
        phone_cq: row.phone_cq || row['Máy cơ quan'] || row['phone_cq'] || '',
        ngaySinh: row.ngaySinh || row['Ngày sinh'] || '',
        bidv: row.bidv || row['BIDV'] || '',
        agribank: row.agribank || row['Agribank'] || '',
        avatar: row.avatar || row['Avatar'] || ''
      })).filter(item => item.hoTen && item.hoTen.trim() !== ''); // chỉ lấy những dòng có tên
      
      // nếu vẫn không có dữ liệu thì hiển thị thông báo
      if (masterData.length === 0) {
        deptLoadingSpan.textContent = '⚠️ Không tìm thấy dữ liệu nhân sự hợp lệ';
      } else {
        deptLoadingSpan.style.display = 'none';
      }
      renderDepartments();
    } catch (err) {
      console.error(err);
      deptLoadingSpan.textContent = '❌ Lỗi tải dữ liệu: ' + err.message;
      deptGrid.innerHTML = `<div class="empty-state">Không thể kết nối đến nguồn dữ liệu. Vui lòng thử lại sau.</div>`;
    }
  }

  // Sự kiện back button
  backBtn.addEventListener('click', backToDepartments);
  
  // Đóng modal khi click nút X hoặc bên ngoài
  closeModalBtn.addEventListener('click', closeModal);
  window.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Khởi chạy ứng dụng
  loadMasterData();
</script>
</body>
</html>
