<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh bạ toàn ngành Thuế</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f0f2f5}
header{background:linear-gradient(135deg,#0d6efd,#0a58ca);color:#fff;padding:20px;text-align:center;font-size:28px;font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.container{max-width:1400px;margin:auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card h3{margin:0 0 15px 0;color:#333;display:flex;align-items:center;gap:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.filters input,.filters select{padding:12px;border:2px solid #e0e0e0;border-radius:8px;width:100%;font-size:14px;transition:all .3s}
.filters input:focus,.filters select:focus{outline:none;border-color:#0d6efd;box-shadow:0 0 0 3px rgba(13,110,253,.1)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.person{background:#fff;border-radius:12px;padding:16px;display:flex;gap:15px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;cursor:pointer}
.person:hover{transform:translateY(-3px);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #e0e0e0;flex-shrink:0}
.person-info{flex:1;min-width:0}
.name{font-weight:bold;font-size:16px;color:#1a1a1a}
.position{color:#0d6efd;font-weight:500;font-size:14px;margin:4px 0}
.department{color:#666;font-size:13px;margin:2px 0}
.phone{display:inline-block;margin-top:6px;padding:4px 12px;background:#e8f0fe;color:#0d6efd;border-radius:20px;text-decoration:none;font-size:13px;font-weight:500;transition:all .2s}
.phone:hover{background:#0d6efd;color:#fff}
.birthday-section{background:linear-gradient(135deg,#fff5f5,#fff);border-left:4px solid #ff6b6b}
.birthday-item{padding:6px 0;border-bottom:1px solid #f0f0f0}
.birthday-item:last-child{border-bottom:none}
.birthday-name{font-weight:500;color:#d63031}
.loading{text-align:center;padding:40px;color:#666}
.loading-spinner{display:inline-block;width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #0d6efd;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.error{background:#fff5f5;color:#d63031;padding:15px;border-radius:8px;border-left:4px solid #d63031}
.stats{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0}
.stats span{background:#f8f9fa;padding:6px 14px;border-radius:20px;font-size:13px;color:#666}
@media (max-width:768px){
 .container{padding:10px}
 .people{grid-template-columns:1fr}
 .person{flex-direction:column;align-items:center;text-align:center}
 .filters{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>📋 DANH BẠ TOÀN NGÀNH THUẾ</header>
<div class="container">
  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Đang tải dữ liệu...</p>
  </div>

  <!-- Error -->
  <div id="error" class="error" style="display:none"></div>

  <!-- Content -->
  <div id="content" style="display:none">
    <!-- Birthday Cards -->
    <div class="card birthday-section">
      <h3>🎂 Sinh nhật hôm nay</h3>
      <div id="today">Đang tải...</div>
    </div>

    <div class="card birthday-section">
      <h3>🎉 Sinh nhật 7 ngày tới</h3>
      <div id="upcoming">Đang tải...</div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="stats">
        <span>👥 Tổng số: <strong id="totalCount">0</strong></span>
        <span>📊 Đơn vị: <strong id="unitCount">0</strong></span>
      </div>
    </div>

    <!-- Filters -->
    <div class="card">
      <div class="filters">
        <input id="search" placeholder="🔍 Tìm tên, SĐT, chức vụ...">
        <select id="unit"><option value="">🏢 Tất cả đơn vị</option></select>
        <select id="phong"><option value="">📁 Tất cả phòng</option></select>
        <select id="coso"><option value="">🏛️ Tất cả Thuế cơ sở</option></select>
        <select id="to"><option value="">📂 Tất cả tổ</option></select>
        <button onclick="resetFilters()" style="padding:10px 20px;background:#6c757d;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500">🔄 Reset</button>
      </div>
    </div>

    <!-- Results -->
    <div id="people" class="people"></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyYo7XdQMqMJx9s66v_4u3XM16vJLIf93sCITUDE5LjglRvVM9xu7TfOTHa7y0rGPIWrw/exec?action=all';
const AVATAR = 'https://raw.githubusercontent.com/thuecoso8/thuecoso8.github.io/main/Avatas/';

let data = [];
let filteredData = [];

function prettyUnit(v) {
  if (!v) return '';
  const map = {
    'CucThue': 'Cục Thuế',
    'HaNoi': 'Thuế TP Hà Nội',
    'ThaiNguyen': 'Thuế tỉnh Thái Nguyên'
  };
  return map[v] || 'Thuế tỉnh ' + v.replace(/([A-Z])/g, ' $1').trim();
}

function birthdayParts(s) {
  if (!s) return null;
  let p = String(s).split('/');
  if (p.length < 2) return null;
  return { d: +p[0], m: +p[1] };
}

function fillSelect(id, values) {
  const el = document.getElementById(id);
  const currentValue = el.value;
  el.innerHTML = `<option value="">${el.options[0].textContent}</option>`;
  const unique = [...new Set(values.filter(Boolean))].sort();
  unique.forEach(v => {
    let o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });
  if (currentValue && unique.includes(currentValue)) {
    el.value = currentValue;
  }
}

function renderBirthdays() {
  const t = new Date();
  const d = t.getDate();
  const m = t.getMonth() + 1;
  const today = [];
  const upcoming = [];

  data.forEach(x => {
    const b = birthdayParts(x.ngaySinh);
    if (!b) return;

    // Check today
    if (b.d === d && b.m === m) {
      today.push(x);
    }

    // Check upcoming 7 days
    const bd = new Date(t.getFullYear(), b.m - 1, b.d);
    const diff = Math.ceil((bd - t) / 86400000);
    if (diff >= 0 && diff <= 7 && !(b.d === d && b.m === m)) {
      upcoming.push(x);
    }
  });

  document.getElementById('today').innerHTML = today.length > 0
    ? today.map(x => `<div class="birthday-item">🎂 <strong class="birthday-name">${x.hoTen}</strong> - ${x.chucVu || ''} (${x.donVi})</div>`).join('')
    : 'Không có ai sinh nhật hôm nay 🌙';

  document.getElementById('upcoming').innerHTML = upcoming.length > 0
    ? upcoming.map(x => `<div class="birthday-item">🎈 <strong class="birthday-name">${x.hoTen}</strong> - ${x.ngaySinh} (${x.donVi})</div>`).join('')
    : 'Không có ai sinh nhật trong 7 ngày tới 📅';
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const u = document.getElementById('unit').value;
  const p = document.getElementById('phong').value;
  const c = document.getElementById('coso').value;
  const t = document.getElementById('to').value;

  filteredData = data.filter(x => {
    const txt = JSON.stringify(Object.values(x)).toLowerCase();
    const matchSearch = !q || txt.includes(q);
    const matchUnit = !u || x.donVi === u;
    const matchPhong = !p || x.phong === p;
    const matchCoSo = !c || x.thueCoSo === c;
    const matchTo = !t || x.toNghiepVu === t;
    return matchSearch && matchUnit && matchPhong && matchCoSo && matchTo;
  });

  // Update stats
  document.getElementById('totalCount').textContent = filteredData.length;

  const html = filteredData.map(x => `
    <div class="person" onclick="window.location.href='tel:${x.soDienThoai || ''}'">
      <img class="avatar" src="${AVATAR}${x.avatar || ''}" 
           onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(x.hoTen || '')}&background=0d6efd&color=fff&size=80'">
      <div class="person-info">
        <div class="name">${x.hoTen || ''}</div>
        <div class="position">${x.chucVu || ''}</div>
        <div class="department">${x.donVi || ''}</div>
        <div class="department">${x.phong || x.thueCoSo || ''}</div>
        <div class="department">${x.toNghiepVu || ''}</div>
        ${x.soDienThoai ? `<a href="tel:${x.soDienThoai}" class="phone">📞 ${x.soDienThoai}</a>` : ''}
        ${x.email ? `<div style="margin-top:4px;font-size:12px;color:#999">✉️ ${x.email}</div>` : ''}
      </div>
    </div>
  `).join('');

  document.getElementById('people').innerHTML = html || '<div style="text-align:center;padding:40px;color:#999">🔍 Không tìm thấy kết quả phù hợp</div>';
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('unit').value = '';
  document.getElementById('phong').value = '';
  document.getElementById('coso').value = '';
  document.getElementById('to').value = '';
  render();
}

// Load data
fetch(API)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(j => {
    if (!j.success) throw new Error(j.message || 'Unknown error');
    
    data = (j.data || []).map(x => ({
      ...x,
      donVi: prettyUnit(x.sheetName),
      hoTen: x.hoTen || '',
      chucVu: x.chucVu || '',
      soDienThoai: x.soDienThoai || '',
      email: x.email || '',
      phong: x.phong || '',
      thueCoSo: x.thueCoSo || '',
      toNghiepVu: x.toNghiepVu || '',
      ngaySinh: x.ngaySinh || '',
      avatar: x.avatar || ''
    }));

    // Populate filters
    fillSelect('unit', data.map(x => x.donVi));
    fillSelect('phong', data.map(x => x.phong));
    fillSelect('coso', data.map(x => x.thueCoSo));
    fillSelect('to', data.map(x => x.toNghiepVu));

    // Update unit count
    document.getElementById('unitCount').textContent = [...new Set(data.map(x => x.donVi).filter(Boolean))].length;

    // Show content
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // Render
    renderBirthdays();
    render();
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.innerHTML = `❌ Lỗi tải dữ liệu: ${err.message}<br><small>Vui lòng thử lại sau hoặc liên hệ quản trị viên.</small>`;
  });

// Event listeners
['search', 'unit', 'phong', 'coso', 'to'].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  }
});
</script>
</body>
</html>
