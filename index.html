<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Danh bạ toàn ngành Thuế</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ====== CSS CHO PHÒNG/CƠ SỞ ====== */
    .org-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .org-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      cursor: pointer;
      transition: all .3s;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .org-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 24px rgba(0,0,0,.12);
      border-color: #0d6efd;
    }
    .org-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .org-card .icon.phong-icon { background: #e3f2fd; color: #0d6efd; }
    .org-card .icon.cosu-icon { background: #e8f5e9; color: #2e7d32; }
    
    .org-card .info { flex: 1; }
    .org-card .info .name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .org-card .info .count { font-size: 14px; color: #888; margin-top: 2px; }
    .org-card .info .type-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 12px;
      margin-top: 4px;
      font-weight: 500;
    }
    .org-card .info .type-badge.phong { background: #e3f2fd; color: #0d6efd; }
    .org-card .info .type-badge.cosu { background: #e8f5e9; color: #2e7d32; }
    .org-card .arrow { color: #ccc; font-size: 20px; transition: all .3s; }
    .org-card:hover .arrow { color: #0d6efd; transform: translateX(4px); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f0f0f0;
    }
    .section-header .title { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .section-header .title i { margin-right: 10px; }
    .section-header .count { font-size: 14px; font-weight: 400; color: #888; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state p { font-size: 16px; }

    .badge-count {
      background: #0d6efd;
      color: #fff;
      padding: 1px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-left">
      <button class="back-btn" id="backBtn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Quay lại
      </button>
      <h1>
        <i class="fas fa-address-book"></i>
        DANH BẠ NGÀNH THUẾ
      </h1>
    </div>
    <div class="header-right">
      <div class="stats-header" id="headerStats">
        <i class="fas fa-spinner fa-spin"></i> Đang tải...
      </div>
      <button class="btn-export" onclick="exportToExcel()" title="Xuất Excel">
        <i class="fas fa-file-excel"></i>
      </button>
      <button class="btn-print" onclick="window.print()" title="In danh sách">
        <i class="fas fa-print"></i>
      </button>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="container">
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p><i class="fas fa-sync fa-spin"></i> Đang tải dữ liệu...</p>
    </div>

    <div id="error" class="error" style="display:none">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorMessage"></span>
    </div>

    <div id="content" style="display:none">
      <nav class="breadcrumb" id="breadcrumb">
        <span onclick="goHome()"><i class="fas fa-home"></i> Trang chủ</span>
      </nav>

      <div id="birthdayContainer"></div>
      <div id="statsContainer"></div>

      <div id="filtersContainer" style="display:none">
        <div class="filters">
          <div class="filter-group">
            <i class="fas fa-search"></i>
            <input id="search" placeholder="Tìm tên, SĐT, chức vụ...">
          </div>
          <div class="filter-group">
            <i class="fas fa-building"></i>
            <select id="phong"><option value="">Tất cả phòng</option></select>
          </div>
          <div class="filter-group">
            <i class="fas fa-layer-group"></i>
            <select id="to"><option value="">Tất cả tổ</option></select>
          </div>
          <div class="filter-group">
            <i class="fas fa-user-tie"></i>
            <select id="chucVu"><option value="">Tất cả chức vụ</option></select>
          </div>
          <button class="btn-reset" onclick="resetFilters()">
            <i class="fas fa-undo"></i> Reset
          </button>
        </div>
      </div>

      <div id="mainContent"></div>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    // ====== CẤU HÌNH ======
    const API = 'https://script.google.com/macros/s/AKfycbyYo7XdQMqMJx9s66v_4u3XM16vJLIf93sCITUDE5LjglRvVM9xu7TfOTHa7y0rGPIWrw/exec?action=all';
    const AVATAR = 'https://raw.githubusercontent.com/thuecoso8/thuecoso8.github.io/main/Avatas/';

    // ====== BIẾN TOÀN CỤC ======
    let allData = [];
    let units = [];
    let currentView = 'home';
    let currentUnit = null;
    let currentOrg = null;
    let currentOrgType = null;
    let currentPage = 1;
    const itemsPerPage = 20;

    // ====== HÀM TIỆN ÍCH ======
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Hàm chuyển đổi ngày sinh sang định dạng DD/MM/YYYY
    function formatDate(dateStr) {
      if (!dateStr) return '';
      
      // Nếu là chuỗi ngày tháng dạng "dd/mm/yyyy"
      if (typeof dateStr === 'string' && dateStr.includes('/')) {
        return dateStr;
      }
      
      // Nếu là đối tượng Date hoặc chuỗi ngày tháng
      try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) {
          // Nếu không parse được, thử xử lý chuỗi "Thu Sep 13 1973 00:00:00 GMT+0700"
          const match = dateStr.match(/(\w+)\s+(\w+)\s+(\d+)\s+(\d+)/);
          if (match) {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const monthIndex = monthNames.indexOf(match[2]);
            if (monthIndex !== -1) {
              const day = String(parseInt(match[3])).padStart(2, '0');
              const month = String(monthIndex + 1).padStart(2, '0');
              const year = match[4];
              return `${day}/${month}/${year}`;
            }
          }
          return dateStr;
        }
        
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
      } catch (e) {
        return dateStr;
      }
    }

    // Hàm lấy ngày tháng từ chuỗi ngày sinh
    function parseDate(dateStr) {
      if (!dateStr) return null;
      
      // Nếu là chuỗi "dd/mm/yyyy"
      if (typeof dateStr === 'string' && dateStr.includes('/')) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
          return { d: parseInt(parts[0]), m: parseInt(parts[1]), y: parseInt(parts[2]) };
        }
      }
      
      // Nếu là đối tượng Date hoặc chuỗi ngày tháng
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return { d: date.getDate(), m: date.getMonth() + 1, y: date.getFullYear() };
        }
      } catch (e) {}
      
      // Thử parse chuỗi "Thu Sep 13 1973 00:00:00 GMT+0700"
      if (typeof dateStr === 'string') {
        const match = dateStr.match(/(\w+)\s+(\w+)\s+(\d+)\s+(\d+)/);
        if (match) {
          const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const monthIndex = monthNames.indexOf(match[2]);
          if (monthIndex !== -1) {
            return { d: parseInt(match[3]), m: monthIndex + 1, y: parseInt(match[4]) };
          }
        }
      }
      
      return null;
    }

    function birthdayParts(s) {
      if (!s) return null;
      const parsed = parseDate(s);
      if (parsed) {
        return { d: parsed.d, m: parsed.m };
      }
      return null;
    }

    function countBirthdayInMonth(people) {
      const now = new Date();
      const currentMonth = now.getMonth() + 1;
      return people.filter(x => {
        const b = birthdayParts(x.ngaySinh);
        return b && b.m === currentMonth;
      });
    }

    function getCurrentPeople() {
      if (currentOrg && currentOrgType === 'phong') {
        return allData.filter(x => x.phong === currentOrg && x.donVi === currentUnit);
      } else if (currentOrg && currentOrgType === 'coso') {
        return allData.filter(x => x.thueCoSo === currentOrg && x.donVi === currentUnit);
      } else if (currentUnit) {
        return allData.filter(x => x.donVi === currentUnit);
      }
      return allData;
    }

    // ====== EXPORT EXCEL ======
    function exportToExcel() {
      const people = getCurrentPeople();
      if (people.length === 0) {
        showToast('Không có dữ liệu để xuất!', 'error');
        return;
      }

      const headers = ['Họ tên', 'Chức vụ', 'Đơn vị', 'Phòng', 'Tổ', 'SĐT', 'Ngày sinh'];
      const csvContent = [
        headers.join(','),
        ...people.map(x => [
          `"${x.hoTen || ''}"`,
          `"${x.chucVu || ''}"`,
          `"${x.donVi || ''}"`,
          `"${x.phong || ''}"`,
          `"${x.toNghiepVu || ''}"`,
          `"${x.soDienThoai || ''}"`,
          `"${formatDate(x.ngaySinh)}"`
        ].join(','))
      ].join('\n');

      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `danh_bach_thue_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
      showToast('Xuất Excel thành công!', 'success');
    }

    // ====== RENDER SINH NHẬT ======
    function renderBirthdayForUnit(unitName, people) {
      const container = document.getElementById('birthdayContainer');
      const now = new Date();
      const currentMonth = now.getMonth() + 1;
      const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 
                          'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];

      const birthdays = people.filter(x => {
        const b = birthdayParts(x.ngaySinh);
        return b && b.m === currentMonth;
      });

      birthdays.sort((a, b) => {
        const ba = birthdayParts(a.ngaySinh);
        const bb = birthdayParts(b.ngaySinh);
        return ba.d - bb.d;
      });

      if (birthdays.length === 0) {
        container.innerHTML = `
          <div class="birthday-card">
            <h3><i class="fas fa-birthday-cake"></i> Sinh nhật tháng ${monthNames[currentMonth - 1]}</h3>
            <div class="no-birthday">
              <i class="fas fa-inbox"></i> Không có ai sinh nhật trong tháng này tại ${unitName}
            </div>
          </div>
        `;
        return;
      }

      let html = `
        <div class="birthday-card">
          <h3>
            <i class="fas fa-birthday-cake"></i> 
            Sinh nhật tháng ${monthNames[currentMonth - 1]} - ${unitName}
            <span class="badge-count">${birthdays.length} người</span>
          </h3>
          <div class="birthday-list">
      `;

      birthdays.forEach(x => {
        const b = birthdayParts(x.ngaySinh);
        html += `
          <div class="birthday-item">
            <span class="name"><i class="fas fa-user"></i> ${x.hoTen || ''}</span>
            <span class="date"><i class="fas fa-calendar-alt"></i> ${b.d}/${b.m}</span>
          </div>
        `;
      });

      html += `</div></div>`;
      container.innerHTML = html;
    }

    // ====== RENDER THỐNG KÊ ======
    function renderQuickStats(people) {
      if (!people || people.length === 0) return '';
      
      const stats = {
        total: people.length,
        departments: [...new Set(people.map(x => x.phong).filter(Boolean))].length,
        teams: [...new Set(people.map(x => x.toNghiepVu).filter(Boolean))].length,
        positions: [...new Set(people.map(x => x.chucVu).filter(Boolean))].length
      };

      return `
        <div class="stats-grid">
          <div class="stat-card purple">
            <div class="number">${stats.total}</div>
            <div class="label"><i class="fas fa-users"></i> Tổng cán bộ</div>
          </div>
          <div class="stat-card pink">
            <div class="number">${stats.departments}</div>
            <div class="label"><i class="fas fa-building"></i> Phòng/Ban</div>
          </div>
          <div class="stat-card blue">
            <div class="number">${stats.teams}</div>
            <div class="label"><i class="fas fa-layer-group"></i> Tổ</div>
          </div>
          <div class="stat-card green">
            <div class="number">${stats.positions}</div>
            <div class="label"><i class="fas fa-user-tie"></i> Chức vụ</div>
          </div>
        </div>
      `;
    }

    // ====== XÂY DỰNG DANH SÁCH ĐƠN VỊ ======
    function buildUnits() {
      const unitMap = {};
      allData.forEach(x => {
        const unit = x.donVi || 'Khác';
        if (!unitMap[unit]) {
          unitMap[unit] = {
            name: unit,
            count: 0,
            phongs: new Set(),
            coSos: new Set(),
            people: []
          };
        }
        unitMap[unit].count++;
        unitMap[unit].people.push(x);
        if (x.phong) {
          unitMap[unit].phongs.add(x.phong);
        }
        if (x.thueCoSo) {
          unitMap[unit].coSos.add(x.thueCoSo);
        }
      });
      return Object.values(unitMap);
    }

    // ====== RENDER TRANG CHỦ ======
    function renderHome() {
      currentView = 'home';
      currentUnit = null;
      currentOrg = null;
      currentOrgType = null;
      currentPage = 1;
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('filtersContainer').style.display = 'none';
      document.getElementById('headerStats').innerHTML = `
        <i class="fas fa-building"></i> ${units.length} đơn vị · 
        <i class="fas fa-users"></i> ${allData.length} cán bộ
      `;

      document.getElementById('breadcrumb').innerHTML = `
        <span onclick="goHome()"><i class="fas fa-home"></i> Trang chủ</span>
      `;
      document.getElementById('birthdayContainer').innerHTML = '';
      document.getElementById('statsContainer').innerHTML = '';

      const container = document.getElementById('mainContent');
      
      const sortedUnits = [...units].sort((a, b) => {
        if (a.name === 'Cục Thuế') return -1;
        if (b.name === 'Cục Thuế') return 1;
        return a.name.localeCompare(b.name);
      });

      let html = `
        <div class="section-title">
          <i class="fas fa-address-book"></i> Danh sách đơn vị
          <span class="count">(${units.length} đơn vị)</span>
        </div>
        <div class="unit-grid">
      `;

      sortedUnits.forEach(unit => {
        const isCucThue = unit.name === 'Cục Thuế';
        const phongCount = unit.phongs.size;
        const coSoCount = unit.coSos.size;
        const birthdayCount = countBirthdayInMonth(unit.people).length;
        
        html += `
          <div class="unit-card ${isCucThue ? 'cuc-thue' : 'thue-tinh'}" onclick="selectUnit('${unit.name}')">
            <div class="icon">${isCucThue ? '🏛️' : '🏢'}</div>
            <div class="name">${unit.name}</div>
            <div class="count">
              <i class="fas fa-users"></i> ${unit.count} cán bộ · 
              <i class="fas fa-building"></i> ${phongCount} phòng · 
              <i class="fas fa-sitemap"></i> ${coSoCount} cơ sở
            </div>
            <div class="badge">${unit.count}</div>
            ${birthdayCount > 0 ? `<div class="birthday-badge"><i class="fas fa-birthday-cake"></i> ${birthdayCount}</div>` : ''}
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    // ====== CHỌN ĐƠN VỊ ======
    function selectUnit(unitName) {
      currentView = 'unit';
      currentUnit = unitName;
      currentOrg = null;
      currentOrgType = null;
      currentPage = 1;
      document.getElementById('backBtn').style.display = 'flex';
      document.getElementById('filtersContainer').style.display = 'none';
      document.getElementById('headerStats').innerHTML = `
        <i class="fas fa-building"></i> ${unitName}
      `;

      document.getElementById('breadcrumb').innerHTML = `
        <span onclick="goHome()"><i class="fas fa-home"></i> Trang chủ</span>
        <span class="separator">›</span>
        <span class="current">${unitName}</span>
      `;

      const unitData = allData.filter(x => x.donVi === unitName);
      
      renderBirthdayForUnit(unitName, unitData);
      document.getElementById('statsContainer').innerHTML = renderQuickStats(unitData);

      const container = document.getElementById('mainContent');
      
      // Lấy danh sách phòng và cơ sở
      const phongs = [...new Set(unitData.map(x => x.phong).filter(Boolean))].sort();
      const coSos = [...new Set(unitData.map(x => x.thueCoSo).filter(Boolean))].sort();

      let html = '';

      // Hiển thị danh sách phòng
      if (phongs.length > 0) {
        html += `
          <div class="section-header">
            <div class="title"><i class="fas fa-door-open" style="color:#0d6efd;"></i> Phòng chức năng</div>
            <div class="count"><i class="fas fa-users"></i> ${phongs.length} phòng</div>
          </div>
          <div class="org-grid">
        `;
        phongs.forEach(phong => {
          const count = unitData.filter(x => x.phong === phong).length;
          html += `
            <div class="org-card" onclick="selectOrg('${phong}', 'phong')">
              <div class="icon phong-icon"><i class="fas fa-door-open"></i></div>
              <div class="info">
                <div class="name">${phong}</div>
                <div class="count"><i class="fas fa-users"></i> ${count} cán bộ</div>
                <span class="type-badge phong"><i class="fas fa-tag"></i> Phòng</span>
              </div>
              <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Hiển thị danh sách cơ sở
      if (coSos.length > 0) {
        html += `
          <div class="section-header" style="margin-top:24px;">
            <div class="title"><i class="fas fa-sitemap" style="color:#2e7d32;"></i> Thuế cơ sở trực thuộc</div>
            <div class="count"><i class="fas fa-users"></i> ${coSos.length} cơ sở</div>
          </div>
          <div class="org-grid">
        `;
        coSos.forEach(coSo => {
          const count = unitData.filter(x => x.thueCoSo === coSo).length;
          html += `
            <div class="org-card" onclick="selectOrg('${coSo}', 'coso')">
              <div class="icon cosu-icon"><i class="fas fa-building"></i></div>
              <div class="info">
                <div class="name">${coSo}</div>
                <div class="count"><i class="fas fa-users"></i> ${count} cán bộ</div>
                <span class="type-badge cosu"><i class="fas fa-tag"></i> Cơ sở</span>
              </div>
              <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
          `;
        });
        html += `</div>`;
      }

      if (phongs.length === 0 && coSos.length === 0) {
        html += `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>Chưa có dữ liệu phòng hoặc cơ sở</p>
            <p style="font-size:13px;color:#ccc;margin-top:8px;">
              Kiểm tra cột donVi trong Sheet để phân loại phòng
            </p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ====== CHỌN PHÒNG HOẶC CƠ SỞ ======
    function selectOrg(orgName, type) {
      currentView = 'org';
      currentOrg = orgName;
      currentOrgType = type;
      currentPage = 1;
      document.getElementById('backBtn').style.display = 'flex';
      document.getElementById('filtersContainer').style.display = 'block';
      
      const typeLabel = type === 'phong' ? 'Phòng' : 'Cơ sở';
      document.getElementById('headerStats').innerHTML = `
        <i class="fas ${type === 'phong' ? 'fa-door-open' : 'fa-building'}"></i> ${orgName}
      `;

      document.getElementById('breadcrumb').innerHTML = `
        <span onclick="goHome()"><i class="fas fa-home"></i> Trang chủ</span>
        <span class="separator">›</span>
        <span onclick="selectUnit('${currentUnit}')">${currentUnit}</span>
        <span class="separator">›</span>
        <span class="current">${orgName}</span>
      `;

      // Lọc dữ liệu theo loại
      let people = [];
      if (type === 'phong') {
        people = allData.filter(x => x.phong === orgName && x.donVi === currentUnit);
      } else {
        people = allData.filter(x => x.thueCoSo === orgName && x.donVi === currentUnit);
      }
      
      renderBirthdayForUnit(orgName, people);
      document.getElementById('statsContainer').innerHTML = renderQuickStats(people);
      
      populateFilters(people);
      renderPeople(people, orgName);
    }

    // ====== RENDER DANH SÁCH CÁN BỘ ======
    function renderPeople(people, title) {
      const container = document.getElementById('mainContent');
      
      const q = document.getElementById('search')?.value?.toLowerCase().trim() || '';
      const phong = document.getElementById('phong')?.value || '';
      const to = document.getElementById('to')?.value || '';
      const chucVu = document.getElementById('chucVu')?.value || '';

      let filtered = people.filter(x => {
        const txt = JSON.stringify(Object.values(x)).toLowerCase();
        const matchSearch = !q || txt.includes(q);
        const matchPhong = !phong || x.phong === phong;
        const matchTo = !to || x.toNghiepVu === to;
        const matchChucVu = !chucVu || x.chucVu === chucVu;
        return matchSearch && matchPhong && matchTo && matchChucVu;
      });

      filtered.sort((a, b) => (a.hoTen || '').localeCompare(b.hoTen || ''));

      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const end = Math.min(start + itemsPerPage, filtered.length);
      const pageItems = filtered.slice(start, end);

      let html = `
        <div class="section-title">
          <i class="fas fa-users"></i> Danh sách cán bộ - ${title}
          <span class="count">(${filtered.length} người)</span>
          ${filtered.length > itemsPerPage ? `<span class="count">· Trang ${currentPage}/${totalPages}</span>` : ''}
        </div>
      `;

      if (filtered.length === 0) {
        html += `<div class="no-data"><i class="fas fa-search"></i> Không tìm thấy cán bộ nào</div>`;
      } else {
        html += `<div class="people-grid">`;
        pageItems.forEach(x => {
          html += `
            <div class="person-card" onclick="showPersonDetail('${x.hoTen}')">
              <img class="avatar" src="${AVATAR}${x.avatar || ''}" 
                   onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(x.hoTen || '')}&background=0d6efd&color=fff&size=72'">
              <div class="info">
                <div class="name">${x.hoTen || ''}</div>
                <div class="position">${x.chucVu || ''}</div>
                <div class="dept"><i class="fas fa-building"></i> ${x.phong || x.thueCoSo || ''}</div>
                ${x.toNghiepVu ? `<div class="dept"><i class="fas fa-layer-group"></i> Tổ: ${x.toNghiepVu}</div>` : ''}
                ${x.soDienThoai ? `<a href="tel:${x.soDienThoai}" class="phone"><i class="fas fa-phone"></i> ${x.soDienThoai}</a>` : ''}
              </div>
            </div>
          `;
        });
        html += `</div>`;

        if (totalPages > 1) {
          html += `
            <div class="pagination">
              <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i> Trước
              </button>
              <span class="page-info">Trang ${currentPage}/${totalPages}</span>
              <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                Sau <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          `;
        }
      }

      container.innerHTML = html;
    }

    // ====== PHÂN TRANG ======
    function changePage(page) {
      currentPage = page;
      if (currentOrg && currentOrgType) {
        let people = [];
        if (currentOrgType === 'phong') {
          people = allData.filter(x => x.phong === currentOrg && x.donVi === currentUnit);
        } else {
          people = allData.filter(x => x.thueCoSo === currentOrg && x.donVi === currentUnit);
        }
        renderPeople(people, currentOrg);
      }
    }

    // ====== HIỂN THỊ CHI TIẾT ======
    function showPersonDetail(name) {
      const people = getCurrentPeople();
      const person = people.find(x => x.hoTen === name);
      if (!person) return;

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-content">
          <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
            <i class="fas fa-times"></i>
          </button>
          <div class="modal-body">
            <img src="${AVATAR}${person.avatar || ''}" 
                 onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(person.hoTen || '')}&background=0d6efd&color=fff&size=120'"
                 class="modal-avatar">
            <h2>${person.hoTen || ''}</h2>
            <div class="modal-info">
              <div><i class="fas fa-user-tie"></i> <strong>Chức vụ:</strong> ${person.chucVu || ''}</div>
              <div><i class="fas fa-building"></i> <strong>Đơn vị:</strong> ${person.donVi || ''}</div>
              <div><i class="fas fa-building"></i> <strong>Phòng:</strong> ${person.phong || ''}</div>
              <div><i class="fas fa-layer-group"></i> <strong>Tổ:</strong> ${person.toNghiepVu || ''}</div>
              <div><i class="fas fa-phone"></i> <strong>SĐT:</strong> ${person.soDienThoai || ''}</div>
              <div><i class="fas fa-calendar-alt"></i> <strong>Ngày sinh:</strong> ${formatDate(person.ngaySinh)}</div>
            </div>
            ${person.soDienThoai ? `
              <button onclick="window.location.href='tel:${person.soDienThoai}'" class="btn-call">
                <i class="fas fa-phone"></i> Gọi điện
              </button>
            ` : ''}
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.addEventListener('click', function(e) {
        if (e.target === this) this.remove();
      });
    }

    // ====== POPULATE FILTERS ======
    function populateFilters(people) {
      const phongSelect = document.getElementById('phong');
      const toSelect = document.getElementById('to');
      const chucVuSelect = document.getElementById('chucVu');
      
      const phongs = [...new Set(people.map(x => x.phong).filter(Boolean))].sort();
      const tos = [...new Set(people.map(x => x.toNghiepVu).filter(Boolean))].sort();
      const chucVus = [...new Set(people.map(x => x.chucVu).filter(Boolean))].sort();
      
      const currentPhong = phongSelect.value;
      const currentTo = toSelect.value;
      const currentChucVu = chucVuSelect.value;
      
      phongSelect.innerHTML = `<option value=""><i class="fas fa-building"></i> Tất cả phòng</option>`;
      phongs.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        phongSelect.appendChild(o);
      });
      if (currentPhong && phongs.includes(currentPhong)) phongSelect.value = currentPhong;
      
      toSelect.innerHTML = `<option value=""><i class="fas fa-layer-group"></i> Tất cả tổ</option>`;
      tos.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        toSelect.appendChild(o);
      });
      if (currentTo && tos.includes(currentTo)) toSelect.value = currentTo;

      chucVuSelect.innerHTML = `<option value=""><i class="fas fa-user-tie"></i> Tất cả chức vụ</option>`;
      chucVus.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        chucVuSelect.appendChild(o);
      });
      if (currentChucVu && chucVus.includes(currentChucVu)) chucVuSelect.value = currentChucVu;
    }

    // ====== RESET FILTERS ======
    function resetFilters() {
      document.getElementById('search').value = '';
      document.getElementById('phong').value = '';
      document.getElementById('to').value = '';
      document.getElementById('chucVu').value = '';
      currentPage = 1;
      if (currentOrg && currentOrgType) {
        let people = [];
        if (currentOrgType === 'phong') {
          people = allData.filter(x => x.phong === currentOrg && x.donVi === currentUnit);
        } else {
          people = allData.filter(x => x.thueCoSo === currentOrg && x.donVi === currentUnit);
        }
        renderPeople(people, currentOrg);
      }
      showToast('Đã reset bộ lọc', 'info');
    }

    // ====== ĐIỀU HƯỚNG ======
    function goHome() {
      renderHome();
    }

    function goBack() {
      if (currentView === 'org') {
        selectUnit(currentUnit);
      } else if (currentView === 'unit') {
        goHome();
      }
    }

    // ====== SHORTCUT BÀN PHÍM ======
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'f') {
        e.preventDefault();
        const search = document.getElementById('search');
        if (search) search.focus();
      }
      if (e.key === 'Escape') {
        const modal = document.querySelector('.modal-overlay');
        if (modal) modal.remove();
      }
      if (e.ctrlKey && e.key === 'Home') {
        e.preventDefault();
        goHome();
      }
    });

    // ====== LOAD DỮ LIỆU ======
    fetch(API)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(j => {
        if (!j.success) throw new Error(j.message || 'Unknown error');
        
        allData = (j.data || []).map(x => ({
          ...x,
          hoTen: x.hoTen || '',
          chucVu: x.chucVu || '',
          soDienThoai: x.soDienThoai || '',
          email: x.email || '',
          phong: x.phong || '',
          thueCoSo: x.thueCoSo || '',
          toNghiepVu: x.toNghiepVu || '',
          ngaySinh: x.ngaySinh || '',
          avatar: x.avatar || '',
          donVi: x.donVi || 'Khác'
        }));

        units = buildUnits();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        renderHome();
        showToast(`Đã tải ${allData.length} cán bộ từ ${units.length} đơn vị`, 'success');
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'block';
        document.getElementById('errorMessage').textContent = `Lỗi tải dữ liệu: ${err.message}`;
        showToast('Lỗi tải dữ liệu!', 'error');
      });

    // ====== EVENT LISTENERS ======
    document.addEventListener('input', function(e) {
      if (e.target.id === 'search' || e.target.id === 'phong' || 
          e.target.id === 'to' || e.target.id === 'chucVu') {
        currentPage = 1;
        if (currentOrg && currentOrgType) {
          let people = [];
          if (currentOrgType === 'phong') {
            people = allData.filter(x => x.phong === currentOrg && x.donVi === currentUnit);
          } else {
            people = allData.filter(x => x.thueCoSo === currentOrg && x.donVi === currentUnit);
          }
          renderPeople(people, currentOrg);
        }
      }
    });
  </script>
</body>
</html>
