<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danh bạ Thuế tỉnh Thái Nguyên</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

.header{
  background:linear-gradient(135deg,#0a5e8f,#0f3b5c);
  color:white;
  padding:28px 20px;
  text-align:center;
}

.header h1{
  font-size:28px;
  margin-bottom:8px;
}

.header p{
  opacity:.9;
}

.container{
  max-width:1280px;
  margin:auto;
  padding:24px;
}

.search-box{
  background:white;
  border-radius:50px;
  display:flex;
  align-items:center;
  padding:10px 18px;
  margin-bottom:24px;
  border:1px solid #dbe4ee;
}

.search-input{
  flex:1;
  border:none;
  outline:none;
  font-size:16px;
  padding:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:24px;
  padding:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  transition:.2s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-4px);
}

.dept-name{
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
  color:#0f3b5c;
}

.count{
  background:#eff6ff;
  display:inline-block;
  padding:4px 12px;
  border-radius:30px;
  font-size:13px;
}

.staff-card{
  background:white;
  border-radius:24px;
  padding:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.04);
  cursor:pointer;
  transition:.2s;
  position:relative;
}

.staff-card:hover{
  transform:translateY(-3px);
}

.staff-top{
  display:flex;
  gap:14px;
  margin-bottom:16px;
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
}

.name{
  font-size:18px;
  font-weight:700;
  margin-bottom:6px;
}

.job{
  background:#ecf5ff;
  color:#0f62fe;
  display:inline-block;
  padding:4px 12px;
  border-radius:30px;
  font-size:13px;
}

.info{
  margin-top:10px;
  font-size:14px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px dashed #e2e8f0;
}

.tag{
  margin-top:12px;
  background:#f8fafc;
  display:inline-block;
  padding:6px 12px;
  border-radius:30px;
  font-size:12px;
}

.back-btn{
  margin-bottom:20px;
  background:white;
  border:1px solid #cbd5e1;
  padding:10px 18px;
  border-radius:40px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}

.modal-content{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:30px;
  padding:28px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  font-size:28px;
  cursor:pointer;
}

.modal-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:auto;
}

.modal-name{
  text-align:center;
  font-size:24px;
  font-weight:700;
  margin-top:14px;
}

.modal-job{
  text-align:center;
  margin-top:8px;
  color:#0f62fe;
}

.detail{
  margin-top:20px;
}

.detail-item{
  background:#f8fafc;
  padding:14px;
  border-radius:18px;
  margin-bottom:12px;
}

.birthday{
  border-left:5px solid #f97316;
  background:#fff7ed;
}

.birthday-icon{
  position:absolute;
  right:14px;
  top:12px;
  font-size:22px;
}

@media(max-width:640px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📋 DANH BẠ THUẾ TỈNH THÁI NGUYÊN</h1>
  <p>Tra cứu công chức theo phòng ban</p>
</div>

<div class="container">

  <div class="search-box">
    🔍
    <input type="text" id="searchInput" class="search-input" placeholder="Tìm theo tên hoặc phòng ban...">
  </div>

  <button class="back-btn" id="backBtn" style="display:none;">
    ← Quay lại phòng ban
  </button>

  <div id="departmentView" class="grid"></div>

  <div id="staffView" class="grid" style="display:none;"></div>

</div>

<div class="modal" id="modal">
  <div class="modal-content">

    <span class="close" id="closeModal">&times;</span>

    <img id="modalAvatar" class="modal-avatar">

    <div class="modal-name" id="modalName"></div>

    <div class="modal-job" id="modalJob"></div>

    <div class="detail">

      <div class="detail-item">
        <b>🏢 Đơn vị</b><br>
        <span id="modalDept"></span>
      </div>

      <div class="detail-item">
        <b>📱 Điện thoại</b><br>
        <span id="modalPhone"></span>
      </div>

      <div class="detail-item">
        <b>☎️ Máy CQ</b><br>
        <span id="modalOffice"></span>
      </div>

      <div class="detail-item">
        <b>🎂 Ngày sinh</b><br>
        <span id="modalBirth"></span>
      </div>

      <div class="detail-item">
        <b>🏦 BIDV</b><br>
        <span id="modalBidv"></span>
      </div>

      <div class="detail-item">
        <b>🌾 Agribank</b><br>
        <span id="modalAgri"></span>
      </div>

    </div>
  </div>
</div>

<script>

const SHEET_URL = 'https://opensheet.elk.sh/1wH_rQwpF2jRO_8s277hq_kmuN-i79JMzKqNx43XAK0Y/Sheet1';

const AVATAR_PATH = 'Avatas/';

const DEFAULT_AVATAR = 'Avatas/default.png';

let masterData = [];

let currentDepartment = null;

const departmentView = document.getElementById('departmentView');
const staffView = document.getElementById('staffView');
const searchInput = document.getElementById('searchInput');
const backBtn = document.getElementById('backBtn');

function normalizeText(text=''){
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}

function getAvatar(avatar){

  if(!avatar || avatar.trim()===''){
    return DEFAULT_AVATAR;
  }

  if(avatar.startsWith('http')){
    return avatar;
  }

  return AVATAR_PATH + avatar;
}

function isBirthdayToday(dateStr){

  if(!dateStr) return false;

  const parts = dateStr.split(/[\/\-\.]/);

  if(parts.length < 2) return false;

  const d = parseInt(parts[0]);
  const m = parseInt(parts[1]);

  const today = new Date();

  return d === today.getDate() &&
         m === today.getMonth()+1;
}

function openModal(person){

  document.getElementById('modalAvatar').src = getAvatar(person.avatar);

  document.getElementById('modalName').innerText = person.hoTen || '';

  document.getElementById('modalJob').innerText = person.congViec || '';

  document.getElementById('modalDept').innerText = person.donVi || '';

  document.getElementById('modalPhone').innerHTML =
  `<a href="tel:${person.soDienThoai}">${person.soDienThoai || '---'}</a>`;

  document.getElementById('modalOffice').innerText = person.phone_cq || '';

  document.getElementById('modalBirth').innerText = person.ngaySinh || '';

  document.getElementById('modalBidv').innerText = person.bidv || '';

  document.getElementById('modalAgri').innerText = person.agribank || '';

  document.getElementById('modal').style.display='flex';
}

function createStaffCard(person){

  const div = document.createElement('div');

  div.className='staff-card';

  if(isBirthdayToday(person.ngaySinh)){
    div.classList.add('birthday');
  }

  div.innerHTML=`

    ${isBirthdayToday(person.ngaySinh)
      ? `<div class="birthday-icon">🎂</div>`
      : ''
    }

    <div class="staff-top">

      <img class="avatar"
        src="${getAvatar(person.avatar)}"
        onerror="this.src='${DEFAULT_AVATAR}'">

      <div>

        <div class="name">${person.hoTen || ''}</div>

        <div class="job">${person.congViec || ''}</div>

      </div>

    </div>

    <div class="info">

      <div class="info-row">
        <span>📱 Di động</span>

        <b>
          <a href="tel:${person.soDienThoai}"
             style="text-decoration:none;color:inherit;">
            ${person.soDienThoai || '---'}
          </a>
        </b>
      </div>

      <div class="info-row">
        <span>☎️ Máy CQ</span>
        <b>${person.phone_cq || '---'}</b>
      </div>

      <div class="tag">
        🏢 ${person.donVi || ''}
      </div>

    </div>
  `;

  div.addEventListener('click',()=>openModal(person));

  return div;
}

function renderDepartments(){

  const map = new Map();

  masterData.forEach(item=>{

    if(item.donVi){

      map.set(
        item.donVi,
        (map.get(item.donVi)||0)+1
      );
    }
  });

  departmentView.innerHTML='';

  [...map.keys()].sort().forEach(dept=>{

    const div = document.createElement('div');

    div.className='card';

    div.innerHTML=`
      <div class="dept-name">${dept}</div>
      <div class="count">${map.get(dept)} cán bộ</div>
    `;

    div.addEventListener('click',()=>{
      currentDepartment = dept;
      renderDepartmentStaff(dept);
    });

    departmentView.appendChild(div);
  });
}

function renderDepartmentStaff(dept){

  backBtn.style.display='inline-block';

  departmentView.style.display='none';

  staffView.style.display='grid';

  staffView.innerHTML='';

  masterData
    .filter(x=>x.donVi===dept)
    .forEach(person=>{
      staffView.appendChild(createStaffCard(person));
    });
}

function search(keyword){

  keyword = normalizeText(keyword);

  if(!keyword){

    if(currentDepartment){

      renderDepartmentStaff(currentDepartment);

    }else{

      staffView.style.display='none';
      departmentView.style.display='grid';
    }

    return;
  }

  const result = masterData.filter(person=>{

    const name = normalizeText(person.hoTen || '');

    const dept = normalizeText(person.donVi || '');

    return name.includes(keyword) ||
           dept.includes(keyword);
  });

  departmentView.style.display='none';

  staffView.style.display='grid';

  staffView.innerHTML='';

  result.forEach(person=>{
    staffView.appendChild(createStaffCard(person));
  });
}

async function loadData(){

  try{

    const res = await fetch(
      SHEET_URL + '?t=' + Date.now()
    );

    const data = await res.json();

    masterData = data.map(row=>({

      id: row.id || '',

      hoTen: row.hoTen || '',

      congViec: row.congViec || '',

      phone_cq: row.phone_cq || '',

      soDienThoai: row.soDienThoai || '',

      bidv: row.bidv || '',

      agribank: row.agribank || '',

      avatar: row.avatar || '',

      donVi: row.donVi || '',

      ngaySinh: row.ngaySinh || ''

    }));

    renderDepartments();

  }catch(err){

    departmentView.innerHTML =
    '<h3>❌ Không tải được dữ liệu</h3>';

    console.error(err);
  }
}

searchInput.addEventListener('input',(e)=>{
  search(e.target.value);
});

backBtn.addEventListener('click',()=>{

  currentDepartment = null;

  staffView.style.display='none';

  departmentView.style.display='grid';

  backBtn.style.display='none';

});

document.getElementById('closeModal')
.addEventListener('click',()=>{

  document.getElementById('modal').style.display='none';
});

window.addEventListener('click',(e)=>{

  if(e.target.id==='modal'){
    document.getElementById('modal').style.display='none';
  }
});

loadData();

</script>

</body>
</html>
