<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh bạ nội bộ - Thuế cơ sở 8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #005bac; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .active-department { background-color: #005bac !important; color: white !important; box-shadow: 0 2px 8px rgba(0,91,172,0.3); }
    .card-hover:hover { transform: translateY(-4px); transition: all 0.2s ease; box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-4 md:p-6">
  <!-- Header -->
  <div class="bg-white rounded-2xl shadow-lg p-5 md:p-6 mb-6 border-l-8 border-l-[#005bac]">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
      <div>
        <div class="flex items-center gap-3">
          <i class="fas fa-address-book text-3xl text-[#005bac]"></i>
          <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Danh bạ nội bộ</h1>
        </div>
        <p class="text-gray-500 mt-1 text-sm flex items-center gap-2">
          <i class="fas fa-building"></i> Thuế cơ sở 8 - Chi cục Thuế khu vực tỉnh Thái Nguyên
        </p>
      </div>
      <div id="updateBadge" class="bg-blue-50 px-4 py-2 rounded-xl text-sm text-[#005bac]">
        <i class="fas fa-sync-alt mr-1"></i> Đang tải dữ liệu...
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    <!-- Sidebar phòng ban -->
    <div class="bg-white rounded-2xl shadow-lg p-4 h-fit lg:sticky lg:top-6">
      <div class="flex items-center gap-2 mb-5 pb-2 border-b border-gray-200">
        <i class="fas fa-users-viewfinder text-[#005bac] text-xl"></i>
        <h2 class="font-bold text-lg text-gray-700">Phòng / Ban</h2>
      </div>
      <div id="departmentList" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="lg:col-span-3">
      <div class="bg-white rounded-2xl shadow-lg p-4 md:p-5">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-5 pb-3 border-b border-gray-100">
          <div class="flex items-center gap-2">
            <i class="fas fa-user-tie text-[#005bac] text-xl"></i>
            <h2 id="currentDepartment" class="font-bold text-xl text-gray-800">Tất cả nhân sự</h2>
            <span id="employeeCount" class="bg-gray-200 text-gray-600 text-xs px-2 py-1 rounded-full ml-2">0</span>
          </div>
          <div class="relative w-full sm:w-72">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input id="searchInput" type="text" placeholder="Tìm kiếm theo tên, chức vụ..." class="w-full border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#005bac] focus:border-transparent shadow-sm" oninput="renderEmployees()" />
          </div>
        </div>
        <div id="employeeGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-5"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ======================= CẤU HÌNH GOOGLE SHEET CỦA BẠN =======================
  const SHEET_ID = '1wH_rQwpF2jRO_8s277hq_kmuN-i79JMzKqNx43XAK0Y';
  const SHEET_NAME = 'Sheet1'; // 👈 Nếu tên trang tính của bạn khác, sửa lại ở đây
  const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;
  
  let employees = [];
  let selectedDepartment = 'all';

  // Hàm tải dữ liệu từ Google Sheet
  async function loadDataFromSheet() {
    const updateBadge = document.getElementById('updateBadge');
    const departmentContainer = document.getElementById('departmentList');
    
    try {
      updateBadge.innerHTML = '<i class="fas fa-spinner fa-pulse mr-1"></i> Đang đồng bộ...';
      
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      
      const rawData = await response.json();
      
      if (!rawData || rawData.length === 0) {
        throw new Error('Sheet không có dữ liệu hoặc tên trang tính không đúng');
      }
      
      // Chuẩn hóa dữ liệu (loại bỏ dòng header nếu trùng, đảm bảo các field)
      employees = rawData.map(row => ({
        hoTen: row.hoTen || row.hoten || row.HỌ_TÊN || row['Họ và tên'] || 'Chưa cập nhật',
        congViec: row.congViec || row.chucvu || row.CHỨC_VỤ || row['Chức vụ'] || '',
        donVi: row.donVi || row.phongban || row.PHÒNG_BAN || row['Đơn vị'] || 'Chưa phân công',
        soDienThoai: row.soDienThoai || row.dienthoai || row.SĐT || row['Số điện thoại'] || '',
        phone_cq: row.phone_cq || row.phonecq || row.PHONE_CQ || row['Phone cơ quan'] || '',
        ngaySinh: row.ngaySinh || row.ngaysinh || row.NGÀY_SINH || row['Ngày sinh'] || '',
        avatar: row.avatar || `https://ui-avatars.com/api/?background=005bac&color=fff&name=${encodeURIComponent(row.hoTen || 'User')}&length=2&fontsize=0.35&size=80`
      }));
      
      // Cập nhật giao diện
      renderDepartments();
      renderEmployees();
      updateBadge.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Đã cập nhật: ' + new Date().toLocaleTimeString('vi-VN');
      
    } catch (error) {
      console.error('Lỗi khi tải dữ liệu:', error);
      updateBadge.innerHTML = '<i class="fas fa-exclamation-triangle mr-1 text-red-600"></i> Không thể tải dữ liệu';
      
      // Hiển thị thông báo lỗi thân thiện
      departmentContainer.innerHTML = `
        <div class="bg-red-50 p-3 rounded-xl text-red-700 text-sm">
          <i class="fas fa-database mr-2"></i> Lỗi kết nối Sheet.<br>
          Vui lòng kiểm tra:
          <ul class="list-disc pl-4 mt-2 space-y-1">
            <li>Sheet đã được publish (File → Share → Publish to web)</li>
            <li>Tên trang tính có đúng là "${SHEET_NAME}" không?</li>
            <li>Các cột dữ liệu có tên: hoTen, donVi, soDienThoai,...</li>
          </ul>
          <button onclick="loadDataFromSheet()" class="mt-3 bg-red-600 text-white px-3 py-1 rounded-lg text-xs">Thử lại</button>
        </div>
      `;
      document.getElementById('employeeGrid').innerHTML = `<div class="text-gray-500 text-center p-8">Không thể hiển thị danh sách do lỗi dữ liệu.</div>`;
    }
  }

  // Hiển thị danh sách phòng ban
  function renderDepartments() {
    const container = document.getElementById('departmentList');
    const departments = [...new Set(employees.map(item => item.donVi).filter(Boolean))].sort();
    
    const allButton = `
      <button onclick="selectDepartment('all')" id="dept-all" class="w-full text-left px-4 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 transition flex items-center gap-2">
        <i class="fas fa-layer-group"></i> <span>Tất cả (${employees.length})</span>
      </button>
    `;
    
    const buttons = departments.map(dep => `
      <button onclick="selectDepartment('${dep.replace(/'/g, "\\'")}')" data-dept="${dep}" class="w-full text-left px-4 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 transition flex items-center gap-2">
        <i class="fas fa-building"></i> <span>${dep} (${employees.filter(e => e.donVi === dep).length})</span>
      </button>
    `).join('');
    
    container.innerHTML = allButton + buttons;
    
    // Highlight phòng ban đang chọn
    document.querySelectorAll('#departmentList button').forEach(btn => {
      if (selectedDepartment === 'all' && btn.id === 'dept-all') btn.classList.add('active-department');
      else if (btn.getAttribute('data-dept') === selectedDepartment) btn.classList.add('active-department');
    });
  }

  window.selectDepartment = function(dep) {
    selectedDepartment = dep;
    renderEmployees();
    // Cập nhật active style
    document.querySelectorAll('#departmentList button').forEach(btn => btn.classList.remove('active-department'));
    if (dep === 'all') document.getElementById('dept-all')?.classList.add('active-department');
    else document.querySelector(`button[data-dept="${dep}"]`)?.classList.add('active-department');
    
    document.getElementById('currentDepartment').innerText = dep === 'all' ? 'Tất cả nhân sự' : dep;
  };

  function renderEmployees() {
    const grid = document.getElementById('employeeGrid');
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = employees.filter(emp => emp.hoTen && emp.hoTen !== 'Chưa cập nhật');
    
    if (selectedDepartment !== 'all') {
      filtered = filtered.filter(item => item.donVi === selectedDepartment);
    }
    if (keyword) {
      filtered = filtered.filter(item => 
        item.hoTen.toLowerCase().includes(keyword) || 
        (item.congViec && item.congViec.toLowerCase().includes(keyword))
      );
    }
    
    document.getElementById('employeeCount').innerText = filtered.length;
    
    if (!filtered.length) {
      grid.innerHTML = `<div class="col-span-full text-gray-500 text-center py-12 bg-gray-50 rounded-2xl"><i class="fas fa-user-slash text-4xl mb-2 block"></i> Không tìm thấy nhân sự phù hợp</div>`;
      return;
    }
    
    grid.innerHTML = filtered.map(item => `
      <div class="border border-gray-100 rounded-2xl p-4 hover:shadow-lg transition-all bg-white card-hover">
        <div class="flex items-center gap-4 mb-4">
          <img src="${item.avatar}" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md" alt="avatar" onerror="this.src='https://ui-avatars.com/api/?background=ccc&color=333&name=${encodeURIComponent(item.hoTen)}'">
          <div>
            <h3 class="font-bold text-lg text-gray-800">${item.hoTen}</h3>
            <p class="text-[#005bac] text-sm font-medium"><i class="fas fa-briefcase mr-1"></i> ${item.congViec || 'Chức vụ'}</p>
          </div>
        </div>
        <div class="space-y-2 text-sm border-t pt-3 border-gray-50">
          <div class="flex items-start gap-2"><i class="fas fa-building text-gray-400 w-5 mt-0.5"></i> <span>${item.donVi}</span></div>
          ${item.soDienThoai ? `<div class="flex items-center gap-2"><i class="fas fa-phone-alt text-blue-500 w-5"></i> <a href="tel:${item.soDienThoai}" class="text-blue-600 hover:underline">${item.soDienThoai}</a></div>` : ''}
          ${item.phone_cq ? `<div class="flex items-center gap-2"><i class="fas fa-building text-gray-400 w-5"></i> <span>CQ: ${item.phone_cq}</span></div>` : ''}
          ${item.ngaySinh ? `<div class="flex items-center gap-2"><i class="fas fa-calendar-alt text-gray-400 w-5"></i> <span>${item.ngaySinh}</span></div>` : ''}
        </div>
      </div>
    `).join('');
  }
  
  // Khởi tạo
  loadDataFromSheet();
</script>
</body>
</html>
