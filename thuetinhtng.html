<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Danh bạ cơ quan</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Inter, sans-serif;
      background:#f5f7fb;
      color:#222;
    }

    .header{
      background:linear-gradient(135deg,#0f62fe,#2563eb);
      color:white;
      padding:30px 20px;
      text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }

    .header h1{
      font-size:32px;
      margin-bottom:10px;
    }

    .header p{
      opacity:0.9;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .toolbar{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:25px;
    }

    .search-box,
    .filter-box{
      flex:1;
      min-width:220px;
    }

    input,
    select{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #ddd;
      font-size:15px;
      outline:none;
      background:white;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:22px;
      padding:20px;
      box-shadow:0 4px 18px rgba(0,0,0,0.06);
      transition:0.25s;
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 25px rgba(0,0,0,0.12);
    }

    .top{
      display:flex;
      gap:15px;
      align-items:center;
      margin-bottom:15px;
    }

    .avatar{
      width:72px;
      height:72px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #eaeaea;
      background:#eee;
    }

    .name{
      font-size:18px;
      font-weight:700;
      margin-bottom:4px;
    }

    .job{
      color:#666;
      font-size:14px;
    }

    .info{
      margin-top:12px;
    }

    .info-item{
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px dashed #eee;
      font-size:14px;
    }

    .tag{
      display:inline-block;
      margin-top:15px;
      background:#edf4ff;
      color:#0f62fe;
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }

    .loading{
      text-align:center;
      padding:40px;
      color:#666;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
    }

    .modal-content{
      background:white;
      width:100%;
      max-width:500px;
      border-radius:24px;
      padding:30px;
      position:relative;
      animation:show .2s ease;
    }

    @keyframes show{
      from{
        transform:scale(.95);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .close{
      position:absolute;
      right:18px;
      top:14px;
      font-size:28px;
      cursor:pointer;
      color:#888;
    }

    .detail-avatar{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      display:block;
      margin:auto;
      margin-bottom:20px;
    }

    .detail-name{
      text-align:center;
      font-size:26px;
      font-weight:700;
      margin-bottom:6px;
    }

    .detail-job{
      text-align:center;
      color:#666;
      margin-bottom:24px;
    }

    .detail-list{
      display:grid;
      gap:14px;
    }

    .detail-item{
      background:#f8f9fc;
      padding:14px;
      border-radius:14px;
    }

    .detail-item b{
      display:block;
      margin-bottom:5px;
      color:#444;
    }

    @media(max-width:768px){
      .header h1{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>DANH BẠ CƠ QUAN</h1>
    <p>Tra cứu thông tin cán bộ - công chức</p>
  </div>

  <div class="container">

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm tên, số điện thoại..." />
      </div>

      <div class="filter-box">
        <select id="unitFilter">
          <option value="">Tất cả đơn vị</option>
        </select>
      </div>
    </div>

    <div id="loading" class="loading">
      Đang tải dữ liệu...
    </div>

    <div class="grid" id="grid"></div>

  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>

      <img id="mAvatar" class="detail-avatar">

      <div class="detail-name" id="mName"></div>
      <div class="detail-job" id="mJob"></div>

      <div class="detail-list">
        <div class="detail-item">
          <b>Đơn vị</b>
          <div id="mUnit"></div>
        </div>

        <div class="detail-item">
          <b>Điện thoại</b>
          <div id="mPhone"></div>
        </div>

        <div class="detail-item">
          <b>Số máy cơ quan</b>
          <div id="mOfficePhone"></div>
        </div>

        <div class="detail-item">
          <b>Ngày sinh</b>
          <div id="mBirth"></div>
        </div>

        <div class="detail-item">
          <b>BIDV</b>
          <div id="mBidv"></div>
        </div>

        <div class="detail-item">
          <b>Agribank</b>
          <div id="mAgri"></div>
        </div>
      </div>

    </div>
  </div>

<script>

const SHEET_URL =
'https://opensheet.elk.sh/1wH_rQwpF2jRO_8s277hq_kmuN-i79JMzKqNx43XAK0Y/Sheet1';

let allData = [];

async function loadData(){

  const res = await fetch(SHEET_URL);
  const data = await res.json();

  allData = data;

  renderUnits(data);
  renderCards(data);

  document.getElementById('loading').style.display='none';
}

function renderUnits(data){

  const units = [...new Set(data.map(i => i.donVi).filter(Boolean))];

  const select = document.getElementById('unitFilter');

  units.forEach(unit => {

    const op = document.createElement('option');
    op.value = unit;
    op.textContent = unit;

    select.appendChild(op);
  });
}

function renderCards(data){

  const grid = document.getElementById('grid');

  grid.innerHTML = '';

  if(data.length === 0){
    grid.innerHTML = '<p>Không có dữ liệu</p>';
    return;
  }

  data.forEach(item => {

    const card = document.createElement('div');
    card.className = 'card';

    card.onclick = () => openModal(item);

    card.innerHTML = `
      <div class="top">

        <img class="avatar"
          src="${item.avatar || 'https://i.imgur.com/HeIi0wU.png'}">

        <div>
          <div class="name">${item.hoTen || ''}</div>
          <div class="job">${item.congViec || ''}</div>
        </div>

      </div>

      <div class="info">

        <div class="info-item">
          <span>Di động</span>
          <b>${item.soDienThoai || ''}</b>
        </div>

        <div class="info-item">
          <span>Máy CQ</span>
          <b>${item.phone_cq || ''}</b>
        </div>

      </div>

      <div class="tag">${item.donVi || ''}</div>
    `;

    grid.appendChild(card);

  });
}

function openModal(item){

  document.getElementById('modal').style.display='flex';

  document.getElementById('mAvatar').src =
    item.avatar || 'https://i.imgur.com/HeIi0wU.png';

  document.getElementById('mName').textContent = item.hoTen || '';
  document.getElementById('mJob').textContent = item.congViec || '';

  document.getElementById('mUnit').textContent = item.donVi || '';
  document.getElementById('mPhone').textContent = item.soDienThoai || '';
  document.getElementById('mOfficePhone').textContent = item.phone_cq || '';
  document.getElementById('mBirth').textContent = item.ngaySinh || '';
  document.getElementById('mBidv').textContent = item.bidv || '';
  document.getElementById('mAgri').textContent = item.agribank || '';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

document.getElementById('searchInput')
.addEventListener('input', filterData);

document.getElementById('unitFilter')
.addEventListener('change', filterData);

function filterData(){

  const keyword =
    document.getElementById('searchInput')
    .value.toLowerCase();

  const unit =
    document.getElementById('unitFilter')
    .value;

  const filtered = allData.filter(item => {

    const text = `
      ${item.hoTen}
      ${item.soDienThoai}
      ${item.phone_cq}
      ${item.congViec}
      ${item.donVi}
    `.toLowerCase();

    const matchKeyword = text.includes(keyword);

    const matchUnit =
      !unit || item.donVi === unit;

    return matchKeyword && matchUnit;
  });

  renderCards(filtered);
}

window.onclick = function(e){

  const modal = document.getElementById('modal');

  if(e.target === modal){
    closeModal();
  }
}

loadData();

</script>

</body>
</html>
